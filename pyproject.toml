[project]
name = "comfyui-model-linker"
version = "1.1.0"
description = "A ComfyUI extension that helps users relink missing models in workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
]

[project.urls]
Repository = "https://github.com/gontz/comfyui-model-linker"
Documentation = "https://github.com/gontz/comfyui-model-linker#readme"

[tool.comfy]
PublisherId = "model-linker"
DisplayName = "Model Linker"
